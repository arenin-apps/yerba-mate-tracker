name: Actualizar precios

on:
  schedule:
    - cron: '0 6 * * *'   # todos los días a las 06:00 UTC (07:00 en Londres en verano)
  workflow_dispatch:       # botón para lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Leer precios de las tiendas
        run: node scripts/actualizar-precios.mjs

      - name: Guardar cambios si los hay
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/precios.json
          if git diff --staged --quiet; then
            echo "Sin cambios de precio hoy."
          else
            git commit -m "Precios del $(date -u +%d-%m-%Y)"
            git push
          fi
