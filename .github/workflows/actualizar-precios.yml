name: Actualizar precios

on:
  schedule:
    # GitHub Actions retrasa bastante los cron en cuentas gratuitas — en la
    # práctica este workflow arrancaba 3-4 horas tarde (comprobado: con
    # '0 6 * * *' terminaba corriendo recién entre las 10 y las 11:40, hora
    # de Londres, nunca cerca de las 07:00). Para que esté listo a las 8am
    # hora UK, lo disparamos bastante antes para absorber ese retraso.
    # 02:00 UTC = 03:00 en Londres en horario de verano (BST). Ajustar a
    # 01:00 UTC cuando vuelva el horario de invierno (GMT) en octubre, para
    # seguir siendo las 02:00 hora local y mantener el mismo colchón.
    - cron: '0 2 * * *'
  workflow_dispatch:       # botón para lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Leer precios de las tiendas
        run: node scripts/actualizar-precios.mjs
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_CAMPAIGN_ID: ${{ secrets.EBAY_CAMPAIGN_ID }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}

      - name: Guardar cambios si los hay
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/precios.json
          if git diff --staged --quiet; then
            echo "Sin cambios de precio hoy."
          else
            git commit -m "Precios del $(date -u +%d-%m-%Y)"
            git push
          fi
